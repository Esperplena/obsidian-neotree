title: Neotree
description: Documentation for the Neotree Obsidian plugin — a crisp, tactile rail for your file explorer.
url: https://esperplena.github.io
baseurl: /obsidian-neotree

remote_theme: just-the-docs/just-the-docs

plugins:
    - jekyll-remote-theme

aux_links:
    GitHub: https://github.com/Esperplena/obsidian-neotree

search_enabled: true
search:
    heading_level: 3
    previews: 2
    preview_words_before: 5
    preview_words_after: 10

heading_anchors: true
color_scheme: light

exclude:
    - SUMMARY.md

footer_content: >-
    Made with ❤️ by <a href="https://github.com/Esperplena">Esperplena</a>.
    <a href="https://github.com/Esperplena/obsidian-neotree">GitHub</a>
